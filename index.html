<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title data-i18n="app.title">Конфігуратор шафи</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <!-- Тексти в розмітці — лише fallback; актуальні підставляє JS за data-i18n* (src/js/i18n). -->
    <header class="topbar">
      <h1 class="topbar__title" data-i18n="app.title">Конфігуратор шафи</h1>
      <div class="topbar__actions">
        <label class="topbar__toggle"
          ><input type="checkbox" id="showDims" checked /> <span data-i18n="toolbar.dims">Розміри</span></label
        >
        <label class="topbar__toggle"
          ><input type="checkbox" id="transparent" /> <span data-i18n="toolbar.transparent">Прозорий режим</span></label
        >
        <button class="btn" id="resetView" data-i18n="toolbar.resetView">Скинути вид</button>
        <button class="btn" id="png" data-i18n="toolbar.png">PNG</button>
        <button class="btn" id="copy" data-i18n="toolbar.copy">Копіювати список</button>
        <button class="btn btn--primary" id="csv" data-i18n="toolbar.csv">CSV для дизайнера</button>
        <button class="btn" id="saveJson" data-i18n="toolbar.save">Зберегти</button>
        <button class="btn" id="loadJson" data-i18n="toolbar.open">Відкрити</button>
      </div>
      <input type="file" id="fileIn" accept=".json,application/json" hidden />
    </header>

    <div class="app">
      <aside class="app__sidebar">
        <div class="app__setup">
          <section class="card">
            <h2 class="card__title" data-i18n="sidebar.presets">Пресети</h2>
            <div class="presets" id="presets"></div>
          </section>
          <section class="card">
            <h2 class="card__title" data-i18n="sidebar.dimensions">Габарити, мм</h2>
            <div class="dims">
              <label class="field"
                ><span data-i18n="sidebar.width">Ширина</span>
                <input class="input" id="W" type="number" inputmode="numeric" min="300" max="5000" step="10"
              /></label>
              <label class="field"
                ><span data-i18n="sidebar.height">Висота</span>
                <input class="input" id="H" type="number" inputmode="numeric" min="300" max="3000" step="10"
              /></label>
              <label class="field"
                ><span data-i18n="sidebar.depth">Глибина</span>
                <input class="input" id="D" type="number" inputmode="numeric" min="200" max="900" step="10"
              /></label>
              <label class="field"
                ><span data-i18n="sidebar.plinth">Цоколь</span>
                <input class="input" id="plinth" type="number" inputmode="numeric" min="0" max="200" step="10"
              /></label>
            </div>
          </section>
          <section class="card">
            <button type="button" class="btn option-btn" id="topSettings">
              <svg
                class="option-btn__icon"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              <span data-i18n="sidebar.topSettings">Налаштування кришки</span>
            </button>
          </section>
        </div>
        <div class="app__sections">
          <section class="card">
            <h2 class="card__title" data-i18n="sidebar.sections">Секції (зліва направо)</h2>
            <div id="sections"></div>
            <button class="btn" id="addSec" data-i18n="sidebar.addSection">+ Додати секцію</button>
            <p class="hint" data-i18n="sidebar.hint"></p>
          </section>
        </div>
      </aside>

      <main class="app__main">
        <div class="viewer app__viewer" id="view">
          <div class="viewer__fallback" id="nogl" data-i18n="viewer.noWebgl"></div>
        </div>
        <div class="report app__report">
          <div id="msgs"></div>
          <button class="report__toggle" id="reportToggle" aria-expanded="false" aria-controls="reportCols">
            <span class="report__chevron" aria-hidden="true">▾</span>
            <span data-i18n="report.toggle">Специфікація</span>
          </button>
          <div class="report__cols" id="reportCols" hidden>
            <div>
              <h3 class="report__title" data-i18n="report.panels">Плити</h3>
              <div class="report__scroll"><table class="table" id="tP"></table></div>
              <div class="report__scroll"><table class="table" id="tS"></table></div>
              <p class="hint" data-i18n="report.sheetsHint"></p>
            </div>
            <div>
              <h3 class="report__title" data-i18n="report.items">Елементи</h3>
              <div class="report__scroll"><table class="table" id="tI"></table></div>
              <h3 class="report__title" data-i18n="report.description">Опис секцій (зверху вниз)</h3>
              <ul class="report__list" id="desc"></ul>
            </div>
          </div>
        </div>
      </main>
    </div>
    <dialog class="modal" id="modal" aria-labelledby="modalTitle">
      <div class="modal__overlay" data-modal-close></div>
      <form class="modal__panel" id="modalForm" novalidate>
        <div class="modal__head">
          <h2 class="modal__title" id="modalTitle"></h2>
          <button
            type="button"
            class="btn btn--icon modal__close"
            data-modal-close
            data-i18n-title="modal.close"
            data-i18n-aria-label="modal.close"
            title="Закрити"
            aria-label="Закрити"
          >
            ✕
          </button>
        </div>
        <div class="modal__body" id="modalBody"></div>
        <div class="modal__foot">
          <button type="button" class="btn" data-modal-close data-i18n="modal.cancel">Скасувати</button>
          <button type="submit" class="btn btn--primary" data-i18n="modal.save">Зберегти</button>
        </div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="assets/js/main.js"></script>
  </body>
</html>
